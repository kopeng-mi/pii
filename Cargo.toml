[package]
name = "pii"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
crossterm = "0.28"
ratatui = "0.29"
nucleo = "0.5"
ureq = { version = "2.9.1", features = ["json"] }
dotenvy = "0.15"
unicode-width = "0.2"
dirs = "5"
rusqlite = { version = "0.32", features = ["bundled"] }
